<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #f4f4f4;
        font-family: Arial, Helvetica, sans-serif;
        color: #222222;
      }
      .email-wrapper {
        width: 100%;
        background-color: #f4f4f4;
        padding: 24px 0;
        border-collapse: collapse;
      }
      .email-wrapper td {
        padding: 0;
        text-align: center;
      }
      .email-container {
        width: 600px;
        background-color: #ffffff;
        border-radius: 4px;
        overflow: hidden;
        border-collapse: collapse;
        text-align: left;
      }
      .email-container td {
        padding: 0;
      }
      .email-header {
        background-color: #2c3e50;
        padding: 16px 24px;
      }
      .email-header span {
        color: #ffffff;
        font-size: 18px;
        font-weight: bold;
      }
      .email-content {
        padding: 24px;
      }
    </style>
  </head>
  <body>
    <table role="presentation" class="email-wrapper">
      <tr>
        <td>
          <table role="presentation" class="email-container">
            <tr>
              <td class="email-header">
                <span>django-notes</span>
              </td>
            </tr>
            <tr>
              <td class="email-content">
                {% block content %}{% endblock %}
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
